[project]
name = "mcp-assay"
version = "0.1.0"
description = "An eval and benchmark harness for MCP servers"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.18",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
mcp-assay = "mcp_assay.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests are plain functions; stops pytest trying to collect the TestCase model.
python_classes = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "BLE"]
# typer's API is built on function calls in argument defaults.
ignore = ["B008"]
